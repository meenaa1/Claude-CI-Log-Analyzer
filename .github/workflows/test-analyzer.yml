name: DS Portal CI Log Analyzer Bot

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  analyze-test-failure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest selenium webdriver-manager anthropic

      - name: Run PyTest against DS Portal (Allow failure to capture logs)
        continue-on-error: true
        run: |
          mkdir -p sample_logs
          pytest tests/test_dsportal.py --tb=short > sample_logs/test-failure.log 2>&1

      - name: Run Claude Failure Analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LOG_FILE_PATH: "sample_logs/test-failure.log"
        run: |
          python scripts/analyze_logs.py

      - name: Output Analysis to Job Summary
        run: |
          cat analysis_report.md >> $GITHUB_STEP_SUMMARY