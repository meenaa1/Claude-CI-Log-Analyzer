name: DS Portal CI Log Analyzer Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  analyze-test-failure:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install Chrome for Selenium
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v2

      # 4. Install project dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest selenium webdriver-manager anthropic python-dotenv

      # 5. Create the log directory
      - name: Prepare Log Directory
        run: mkdir -p sample_logs

      # 6. Run Selenium tests and preserve the exit code
      - name: Run PyTest against DS Portal
        id: pytest
        continue-on-error: true
        env:
          CI: "true"
        run: |
          set +e
          pytest tests/test_dsportal.py --tb=short -v \
            > sample_logs/test-failure.log 2>&1
          TEST_EXIT_CODE=$?
          cat sample_logs/test-failure.log
          echo "exit_code=$TEST_EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit "$TEST_EXIT_CODE"

      # 7. Analyze failures with Claude
      - name: Run Claude Failure Analysis
        if: always() && steps.pytest.outcome == 'failure'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars['ANTHROPIC_MODEL'] || 'claude-3-5-sonnet-20241022' }}
          LOG_FILE_PATH: sample_logs/test-failure.log
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not configured."
            exit 1
          fi

          python scripts/analyze_logs.py

      # 8. Create a report when tests pass
      - name: Create Success Report
        if: always() && steps.pytest.outcome == 'success'
        run: |
          {
            echo "## ✅ DS Portal Test Results"
            echo ""
            echo "All automated UI tests passed."
            echo ""
            echo "No failure analysis was needed."
          } > analysis_report.md

      # 9. Add the report to the GitHub Actions Summary
      - name: Output Analysis to Job Summary
        if: always()
        run: |
          if [ -f analysis_report.md ]; then
            cat analysis_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ⚠️ Analysis Report Unavailable" >> "$GITHUB_STEP_SUMMARY"
            echo "Check the workflow logs for the analyzer error." >> "$GITHUB_STEP_SUMMARY"
          fi

      # 10. Fail the workflow if the tests failed
      - name: Mark Workflow Failed if Tests Failed
        if: always() && steps.pytest.outcome == 'failure'
        run: |
          echo "The Selenium test suite failed."
          exit 1
