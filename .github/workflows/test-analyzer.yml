name: CI Log Analyzer Bot

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  analyze-test-failure:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic

      - name: Run Claude Failure Analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LOG_FILE_PATH: "sample_logs/test-failure.log"
        run: |
          python scripts/analyze_logs.py

      - name: Output Analysis to Job Summary
        run: |
          cat analysis_report.md >> $GITHUB_STEP_SUMMARY